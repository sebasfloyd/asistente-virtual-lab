<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: #0C0C0D; }
  body {
    font-family: Geist, sans-serif;
    color: #fff;
    padding: 54px 72px 48px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,.12);
    padding-bottom: 22px;
  }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 22px; letter-spacing: -0.03em; }
  .mark { width: 22px; height: 22px; background: #F56300; border-radius: 5px; }
  .count { font-family: "Geist Mono", ui-monospace, monospace; font-size: 16px; color: rgba(255,255,255,.5); letter-spacing: 0.08em; }
  .tag {
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 16px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #F56300;
    margin: 48px 0 18px;
  }
  h1 {
    font-size: 84px;
    font-weight: 600;
    letter-spacing: -0.055em;
    line-height: 0.97;
    max-width: 14ch;
  }
  h1 em { font-style: normal; color: #F56300; }
  .foot {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 20px;
    color: rgba(255,255,255,.55);
  }
  .foot b { color: #fff; font-weight: 500; }
</style>
</head>
<body>
  <div>
    <div class="top">
      <div class="brand"><span class="mark"></span>Ruptive</div>
      <div class="count">01 / 03</div>
    </div>
    <div class="tag">Asistente propio</div>
    <h1>Tu asistente virtual. <em>En tu compu.</em></h1>
  </div>
  <div class="foot">
    <span>ruptiveai.com</span>
    <span>Telegram y WhatsApp · vos aprobás lo que sale</span>
  </div>
</body>
</html>
